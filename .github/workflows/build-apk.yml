name: Build APK

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag or run number
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Tagged release: v1.2.3 -> versionCode 1002003
            NAME="${GITHUB_REF_NAME#v}"
            MAJOR="$(echo "$NAME" | cut -d. -f1)"; MAJOR="${MAJOR:-1}"
            MINOR="$(echo "$NAME" | cut -d. -f2)"; MINOR="${MINOR:-0}"
            PATCH="$(echo "$NAME" | cut -d. -f3)"; PATCH="${PATCH:-0}"
            CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          else
            # Unreleased branch build: 0.0.<run> so any tagged release outranks it
            NAME="0.0.${GITHUB_RUN_NUMBER}"
            CODE=$((GITHUB_RUN_NUMBER))
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building Arena $NAME (versionCode $CODE)"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug \
            -PVERSION_NAME=${{ steps.version.outputs.name }} \
            -PVERSION_CODE=${{ steps.version.outputs.code }}

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "ArenaAI-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ArenaAI-debug-apk
          path: ArenaAI-*.apk
          if-no-files-found: error

      - name: Publish release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ArenaAI-*.apk
          generate_release_notes: true
          body: |
            **Arena ${{ steps.version.outputs.name }}**

            Install: download the APK below, tap it, and approve Android's
            "update this app?" prompt.

            Apps already installed with this build will detect this release
            automatically and offer the update in-app.
