name: Build APK

# Every push to the app branch publishes a downloadable APK release, so installed
# copies see the update in-app. No tagging needed.
#
# If a run fails instantly with "no steps" / runner_id 0, GitHub Actions is not
# allowed to run for this repository. Either enable it in
# Settings -> Actions -> General -> "Allow all actions", or publish from your PC
# with:  publish.bat

# Pushing to main publishes a release (that is what the app's updater reads). Any other
# branch only builds and uploads an artifact: a second branch must never be able to become
# "the latest release" for people who already installed the app.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decide version
        id: v
        run: |
          set -euo pipefail
          # The version follows app/build.gradle, which is the single source of truth:
          #   1.4.22 / versionCode 1002033, and exactly +1 on both per build.
          #
          # The first version of this file used the commit count alone and produced 1.4.78
          # with code 1004078 - nowhere near the 1002xxx convention, and far ahead of the
          # 1.4.22 the app was actually on, so the in-app updater would have called every
          # CI build a downgrade. Now the count only ever adds to the patch number.
          BASE="$(grep -oE "VERSION_NAME.\) \?: '[0-9.]+'" app/build.gradle | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          BASE="${BASE:-1.4.22}"
          CODEBASE="$(grep -oE "VERSION_CODE.\) \?: '[0-9]+'" app/build.gradle | head -1 | grep -oE '[0-9]+')"
          CODEBASE="${CODEBASE:-1002033}"
          MAJ="$(echo "$BASE" | cut -d. -f1)"
          MIN="$(echo "$BASE" | cut -d. -f2)"
          PATCHBASE="$(echo "$BASE" | cut -d. -f3)"
          # Builds since the last release tag, so the patch number crawls instead of jumping
          # with every commit ever made. No tag yet (fresh clone, shallow tags) -> 1.
          LAST_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          if [ -n "$LAST_TAG" ]; then
            STEP="$(git rev-list --count "$LAST_TAG"..HEAD)"
          else
            STEP=1
          fi
          if [ "$STEP" -lt 1 ]; then STEP=1; fi
          PATCH=$((PATCHBASE + STEP))
          NAME="$MAJ.$MIN.$PATCH"
          CODE=$((CODEBASE + STEP))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $NAME (code $CODE)"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug \
            -PVERSION_NAME=${{ steps.v.outputs.name }} \
            -PVERSION_CODE=${{ steps.v.outputs.code }}

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Agon-${{ steps.v.outputs.name }}.apk"

      # Always keep a build artifact, even if the release upload is not permitted.
      - uses: actions/upload-artifact@v4
        with:
          name: Agon-apk
          path: Agon-*.apk
          if-no-files-found: error

      - name: Publish release (this is what the app's updater reads)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.name }}
          name: Agon ${{ steps.v.outputs.name }}
          files: Agon-*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            **Agon ${{ steps.v.outputs.name }}**

            Download `Agon-${{ steps.v.outputs.name }}.apk` and tap it to install.

            Apps already running Agon detect this release automatically
            (**Update → Check for updates**) and will download it and ask you to
            approve the install — nothing installs silently.
