plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.arena.webapp'
    compileSdk 35

    defaultConfig {
        applicationId 'app.erawat.agon'
        minSdk 24
        // Kept at 34 on purpose: Google forces edge-to-edge drawing for targetSdk 35+,
        // which can push the chat box under the system/keyboard bars. Bump to 35 and add
        // android:windowOptOutEdgeToEdgeEnforcement to values-v35/themes.xml if you
        // plan to publish on Google Play.
        targetSdk 34
        // versionName drives the in-app updater. publish.bat / CI stamp the real
        // version from the release tag, so these are just local defaults.
        def vCode = (project.findProperty('VERSION_CODE') ?: '1002033').toString()
        def vName = (project.findProperty('VERSION_NAME') ?: '1.4.22').toString()
        versionCode vCode.toInteger()
        versionName vName

        buildConfigField "String", "ARENA_GH_TOKEN", '"' + (project.findProperty("ARENA_GH_TOKEN") ?: "") + '"'

        // 32-bit and 64-bit are both real targets, not an afterthought.
        //
        // This app ships no native .so of its own - the only native code in the APK comes
        // from AndroidX (core, browser), and those are plain Java libraries - so the APK is
        // architecture-independent bytecode and runs on everything from a 32-bit
        // armeabi-v7a phone to a 64-bit arm64 device, x86/x86_64 emulators included.
        // ndk.abiFilters is set anyway: it documents the intent and it stops a future
        // dependency from silently dropping one side (Play requires 64-bit, and plenty of
        // cheap devices are still 32-bit only).
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
        // One APK for every device, not per-ABI splits: publishing one asset means the
        // in-app updater cannot pick the wrong one.
        splits {
            abi {
                enable false
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // Debug builds automatically use the local debug keystore.
        release {
            // Generated by tools/make-keystore.sh (or your own keystore).
            // Values are read from keystore.properties so no secrets live in git.
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                def props = new Properties()
                propsFile.withInputStream { props.load(it) }
                storeFile = rootProject.file(props['storeFile'])
                storePassword = props['storePassword']
                keyAlias = props['keyAlias']
                keyPassword = props['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // No ".debug" id suffix: the package name is app.erawat.agon for both build
            // types, which is what shows in the installer. Installing a debug build over
            // a release build then behaves like a normal update.
        }
        release {
            // Same installer-permission rule for release builds (sideload installs).
            minifyEnabled false
            shrinkResources false
            if (rootProject.file('keystore.properties').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Custom Tabs: only used for the optional "open sign-in in a browser" route,
    // because Google's OAuth policy refuses to finish inside a WebView.
    implementation 'androidx.browser:browser:1.8.0'
    // Only for FileProvider, which the package installer needs to read the
    // downloaded APK. Everything else is platform APIs.
    implementation 'androidx.core:core:1.13.1'
}
