plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.arena.webapp'
    compileSdk 35

    defaultConfig {
        applicationId 'app.erawat.agon'
        minSdk 24
        // Kept at 34 on purpose: Google forces edge-to-edge drawing for targetSdk 35+,
        // which can push the chat box under the system/keyboard bars. Bump to 35 and add
        // android:windowOptOutEdgeToEdgeEnforcement to values-v35/themes.xml if you
        // plan to publish on Google Play.
        targetSdk 34
        // versionName drives the in-app updater. publish.bat / CI stamp the real
        // version from the release tag, so these are local defaults.
        //
        // THE RULE, and it must not be broken: versionCode is DERIVED from versionName with
        //     major * 1_000_000 + minor * 1_000 + patch
        // because that is exactly how UpdateManager turns a release tag into a number. When
        // the two disagreed (1.4.26 shipped as 1002035 - the old 1002xxx convention - while
        // the app computed 1004026 from the tag) the app saw its own install as older than
        // the release it came from, and offered the same update forever.
        def vName = (project.findProperty('VERSION_NAME') ?: '1.4.22').toString()
        def vParts = vName.tokenize('.')
        def vDerived = (vParts.size() > 0 ? vParts[0].toInteger() : 0) * 1000000 \
                + (vParts.size() > 1 ? vParts[1].toInteger() : 0) * 1000 \
                + (vParts.size() > 2 ? vParts[2].toInteger() : 0)
        // VERSION_CODE may override, for a one-off build only.
        def vCode = (project.findProperty('VERSION_CODE') ?: vDerived.toString()).toString()
        versionCode vCode.toInteger()
        versionName vName

        // 32-bit and 64-bit are both real targets, not an afterthought.
        //
        // This app ships no native .so of its own - the only native code in the APK comes
        // from AndroidX (core, browser), and those are plain Java libraries - so the APK is
        // architecture-independent bytecode and runs on everything from a 32-bit
        // armeabi-v7a phone to a 64-bit arm64 device, x86/x86_64 emulators included.
        // ndk.abiFilters is set anyway: it documents the intent and it stops a future
        // dependency from silently dropping one side (Play requires 64-bit, and plenty of
        // cheap devices are still 32-bit only).
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
        // One APK for every device, not per-ABI splits: publishing one asset means the
        // in-app updater cannot pick the wrong one.
        splits {
            abi {
                enable false
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // The one key the PC and the phone both sign with, when it exists.
        //
        // Android installs an update only over an app signed with the SAME key, and the
        // default debug key is a different file on every machine - so without this a PC
        // build and a phone build of the same code refuse each other with "App not
        // installed as package conflicts with an existing package". Both build paths
        // write agon-build.properties (git-ignored) next to the .jks it names.
        //
        // Declared here rather than inside buildTypes because a signingConfigs block in
        // the middle of buildTypes is not the DSL's shape; this is.
        shared {
            def sharedFile = rootProject.file('agon-build.properties')
            if (sharedFile.exists()) {
                def sharedProps = new Properties()
                sharedFile.withInputStream { sharedProps.load(it) }
                storeFile = rootProject.file(sharedProps['storeFile'])
                storePassword = sharedProps['storePassword']
                keyAlias = sharedProps['keyAlias']
                keyPassword = sharedProps['keyPassword']
            }
        }
        // Debug builds automatically use the local debug keystore.
        release {
            // Written by hand (or copied from an existing keystore). build.py creates
            // agon-build.properties instead, which is the shared key.
            // Values are read from keystore.properties so no secrets live in git.
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                def props = new Properties()
                propsFile.withInputStream { props.load(it) }
                storeFile = rootProject.file(props['storeFile'])
                storePassword = props['storePassword']
                keyAlias = props['keyAlias']
                keyPassword = props['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // No ".debug" id suffix: the package name is app.erawat.agon for both build
            // types, which is what shows in the installer. Installing a debug build over
            // a release build then behaves like a normal update.
            //
            // A debug build is signed with ~/.android/debug.keystore, which is a different
            // file on every machine - so a phone build and a PC build of the same code
            // cannot install over each other ("App not installed as package conflicts with
            // an existing package"). That is a dead end for anyone who builds in both
            // places, so a shared key is used instead whenever one exists.
            //
            //   agon-build.jks + agon-build.properties   <- written by BOTH build paths
            //   (build.py creates it on the phone; tools/publish.ps1 creates the
            //   same file on the PC when it is missing)
            //
            // Order: the shared key, then any keystore.properties (what earlier phone
            // builds wrote), then Gradle's own ~/.android/debug.keystore.
            //
            // ALWAYS, with no opt-in flag. It used to need -PAGON_DEBUG_KEY=1, which
            // build.py passes but a hand-typed `gradlew assembleDebug` and Android Studio
            // do not - and that is exactly how a build made somewhere else ends up signed
            // with that machine's ~/.android/debug.keystore: it installs, then every
            // published APK is refused over it with "App not installed as package
            // conflicts with an existing package", and the only cure is uninstalling -
            // which wipes the arena session. Signing with the project's own key is never
            // the wrong thing, so it is not a switch any more.
            def sharedPropsFile = rootProject.file('agon-build.properties')
            if (sharedPropsFile.exists()) {
                // A properties file naming a missing .jks would otherwise make AGP
                // fall back to the default debug key, silently producing the very APK
                // that gets refused - so say it instead.
                def chk = new Properties()
                sharedPropsFile.withInputStream { chk.load(it) }
                if (!rootProject.file(chk['storeFile']).exists()) {
                    throw new GradleException("agon-build.properties names "
                            + chk['storeFile'] + ", which is not in " + rootProject
                            + ". Restore the key file, or delete both so a new one is made.")
                }
                signingConfig signingConfigs.shared
            } else if (rootProject.file('keystore.properties').exists()) {
                signingConfig signingConfigs.release
            }
        }
        release {
            // Same installer-permission rule for release builds (sideload installs): the
            // project's own key wins, because that is the one the installed app carries.
            minifyEnabled false
            shrinkResources false
            if (rootProject.file('agon-build.properties').exists()) {
                signingConfig signingConfigs.shared
            } else if (rootProject.file('keystore.properties').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Custom Tabs: only used for the optional "open sign-in in a browser" route,
    // because Google's OAuth policy refuses to finish inside a WebView.
    implementation 'androidx.browser:browser:1.8.0'
    // Only for FileProvider, which the package installer needs to read the
    // downloaded APK. Everything else is platform APIs.
    implementation 'androidx.core:core:1.13.1'
}
